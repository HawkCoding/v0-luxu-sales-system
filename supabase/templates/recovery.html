<h2>Reset your Luxus Sales password</h2>

<p>Use the link below to choose a new password. It expires in one hour.</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/set-new-password">
    Choose a new password
  </a>
</p>

<p>
  The link works on any device — you can request it on your desktop and open it on
  your phone.
</p>

<p>If you did not request this, ignore this email; your password stays unchanged.</p>
