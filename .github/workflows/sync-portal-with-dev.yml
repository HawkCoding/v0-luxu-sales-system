name: Sync Travel-Through-Time portal with dev

# Keeps the prospect demo portal branch (Travel-Through-Time) up to date with
# dev. Branding is env-driven (see lib/brand.ts), so the branch carries no
# code difference from dev and these merges stay conflict-free.

on:
  push:
    branches: [dev]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # daily fallback (runs from the default branch)

concurrency:
  group: sync-portal
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Travel-Through-Time
          fetch-depth: 0

      - name: Merge dev into Travel-Through-Time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev:dev
          if git merge --no-edit dev; then
            git push origin HEAD:Travel-Through-Time
            echo "Portal synced with dev."
          else
            echo "::error::Merge conflict syncing dev -> Travel-Through-Time. Resolve manually."
            exit 1
          fi
