name: DB Migrations

on:
  push:
    branches: [dev, main]

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-merge drift checking is deliberately local-only (`pnpm db:check-drift:dev`
  # / `:prod`) - CI only reacts to merges. See DEVELOPMENT_ENVIRONMENT.md.
  #
  # push to main: auto-apply any pending migrations to production. Only
  # fires from a merged dev->main promotion PR, since the pre-push hook
  # already blocks direct pushes to main.
  migrate-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending migrations to production
        shell: pwsh
        env:
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          ALLOW_PRODUCTION_DB_PUSH: I_UNDERSTAND_THIS_WRITES_TO_PRODUCTION
        run: |
          ./scripts/sync-remote-databases.ps1 -Mode push -Target production -ConfirmProduction

  # push to dev/main (post-merge): authoritative confirmation that the
  # branch and its hosted DB actually match. Waits on migrate-prod so a
  # main push reports the post-auto-push state, not the pre-push gap.
  push-drift-check:
    if: |
      github.event_name == 'push' &&
      always() &&
      (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped')
    needs: [migrate-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check migration drift against ${{ github.ref_name }}
        shell: pwsh
        env:
          SUPABASE_DEV_DB_URL: ${{ secrets.SUPABASE_DEV_DB_URL }}
          SUPABASE_PROD_DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
        run: |
          $target = if ("${{ github.ref_name }}" -eq "main") { "production" } else { "development" }
          ./scripts/check-migration-drift.ps1 -Target $target
